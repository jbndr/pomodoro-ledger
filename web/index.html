<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Pomodoro timer with estimated tasks, cycle and time tracking per task, and progress charts.">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1110" media="(prefers-color-scheme: dark)">
<script>try { const t = JSON.parse(localStorage.getItem("pl.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23D8421F'/%3E%3Cpath d='M16 7c-1.5-2.4-4-3-6-2.6 1.4 1 2.6 2 3.4 3.6M16 7c1.2-2 3.4-3 6-2.6-1.3 1.3-3 2.4-4.4 3.3' fill='none' stroke='%231F7D59' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>body{margin:0} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Pomodoro Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="var(--tomato)"/><path d="M16 7c-1.5-2.4-4-3-6-2.6 1.4 1 2.6 2 3.4 3.6M16 7c1.2-2 3.4-3 6-2.6-1.3 1.3-3 2.4-4.4 3.3" fill="none" stroke="var(--leaf)" stroke-width="2.2" stroke-linecap="round"/><path d="M16 18V12.5M16 18l3.6 2.2" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span>Pomodoro Ledger</span>
    </div>
    <div class="bar-right">
      <button class="icon-btn" id="openSettings" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="top">
    <section class="timer-card" aria-label="Timer">
      <button class="icon-btn float-btn" type="button" id="floatBtn" aria-label="Open floating timer" title="Open floating timer" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="11" y="11" width="8" height="7" rx="1" fill="currentColor" stroke="none"/></svg></button>
    </section>

    <section class="panel" aria-labelledby="tasksH">
      <div class="sec-head tasks-head">
        <h2 id="tasksH">Tasks</h2>
      </div>
    </section>
  </main>

</div>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-page="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><span id="tabTime">Timer</span></button>
  <button type="button" data-page="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Tasks</span></button>
  <button type="button" data-page="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg><span>Progress</span></button>
</nav>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
