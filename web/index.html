<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Pomodoro timer with estimated tasks, cycle and time tracking per task, and progress charts.">
<meta name="theme-color" content="#EDEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1110" media="(prefers-color-scheme: dark)">
<script>try { const t = JSON.parse(localStorage.getItem("pl.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<style>body{margin:0} img{max-width:100%} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Pomodoro Ledger</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pomodoro Ledger">
<meta property="og:title" content="Pomodoro Ledger">
<meta property="og:description" content="A focus timer that shows how long things really take">
<meta property="og:url" content="https://pomodoro.jbndr.com/app/">
<meta property="og:image" content="https://pomodoro.jbndr.com/og-light.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Find out how long things really take: Pomodoro Ledger's focus timer next to today's tasks">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pomodoro.jbndr.com/og-light.png">
<meta name="twitter:image:alt" content="Find out how long things really take: Pomodoro Ledger's focus timer next to today's tasks">
<link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css" vite-ignore>
<link rel="stylesheet" href="/fonts/faces.css" vite-ignore>
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="5.6" cy="14" r="4.5" fill="var(--tomato)"/><path d="M13.04 20.96L22.16 7.76" fill="none" stroke="var(--leaf)" stroke-width="6" stroke-linecap="round"/></svg>
      <span>Pomodoro Ledger</span>
    </div>
    <div class="bar-right"></div>
  </header>

  <main class="top">
    <section class="timer-card" aria-label="Timer">
      <button class="icon-btn float-btn" type="button" id="floatBtn" aria-label="Open floating timer" title="Open floating timer" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="11" y="11" width="8" height="7" rx="1" fill="currentColor" stroke="none"/></svg></button>
    </section>

    <section class="panel" aria-labelledby="tasksH">
      <div class="sec-head tasks-head">
        <h2 class="vh" id="tasksH">Tasks</h2>
      </div>
    </section>
  </main>

</div>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-page="timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><span id="tabTime">Timer</span></button>
  <button type="button" data-page="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Tasks</span></button>
  <button type="button" data-page="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 16v-5M12 16V7M17 16v-8"/></svg><span>Insights</span></button>
</nav>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
