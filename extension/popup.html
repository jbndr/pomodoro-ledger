<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site Blocker</title>
<link rel="stylesheet" href="page.css">
<style>
  body { width: 340px; }
  main { display: grid; gap: 14px; padding: 16px; }
  .brand { font-size: 15px; }
  .brand svg { width: 22px; height: 22px; }
  .status { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); translate: 0 -1px; }
  .status[data-on="true"] i { background: var(--tomato); }
  .status p { margin: 0; font-weight: 600; font-size: 14.5px; line-height: 1.35; }
  .status small { grid-column: 2; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
  .acts { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .acts a { font-size: 13.5px; white-space: nowrap; color: var(--muted); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="var(--tomato)"/><path d="M16 7c-1.5-2.4-4-3-6-2.6 1.4 1 2.6 2 3.4 3.6M16 7c1.2-2 3.4-3 6-2.6-1.3 1.3-3 2.4-4.4 3.3" fill="none" stroke="var(--leaf)" stroke-width="2.2" stroke-linecap="round"/><path d="M16 18V12.5M16 18l3.6 2.2" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>Site Blocker</div>
  <div class="status" id="status" data-on="false" role="status"><i></i><p id="line">…</p><small id="sub"></small></div>
  <div class="acts">
    <button class="btn small" id="options" type="button">Edit blocked sites</button>
    <a id="app" href="https://pomodoro.jbndr.com/" target="_blank" rel="noopener">Open Pomodoro Ledger</a>
  </div>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
