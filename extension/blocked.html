<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus time</title>
<link rel="icon" href="icons/32.png">
<link rel="stylesheet" href="page.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  main { width: min(100%, 460px); display: grid; justify-items: center; gap: 22px; text-align: center; }
  .brand { color: var(--muted); font-size: 15px; }
  .brand svg { width: 22px; height: 22px; }
  .card { width: 100%; display: grid; justify-items: center; gap: 6px; padding: 34px 28px 30px; border-radius: 24px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--tomato); }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--tomato); animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 color-mix(in oklab, var(--tomato) 50%, transparent); } 70%, to { box-shadow: 0 0 0 8px transparent; } }
  @media (prefers-reduced-motion: reduce) { .eyebrow i { animation: none; } }
  h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: -.02em; }
  .left { margin: 10px 0 0; font-family: var(--f-display); font-weight: 650; font-size: clamp(64px, 20vw, 88px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; font-variation-settings: "opsz" 96; }
  .left-label { margin: 0 0 6px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
  .task { margin: 8px 0 0; max-width: 100%; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .task b { color: var(--fg); font-weight: 600; }
  .site { margin: 14px 0 0; padding: 8px 14px; border-radius: 999px; border: 1px dashed var(--line-2); font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .site span { font-family: var(--f-mono); font-size: 13px; color: var(--fg); }
  .acts { display: grid; justify-items: center; gap: 10px; width: 100%; }
  .acts .btn.solid { width: 100%; max-width: 300px; height: 46px; font-size: 15px; border-radius: 14px; }
  .pass small { color: var(--faint); }
  .msg { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="18" r="11" fill="var(--tomato)"/><path d="M16 7c-1.5-2.4-4-3-6-2.6 1.4 1 2.6 2 3.4 3.6M16 7c1.2-2 3.4-3 6-2.6-1.3 1.3-3 2.4-4.4 3.3" fill="none" stroke="var(--leaf)" stroke-width="2.2" stroke-linecap="round"/><path d="M16 18V12.5M16 18l3.6 2.2" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>Pomodoro Ledger</div>
  <section class="card" aria-labelledby="title">
    <p class="eyebrow"><i></i>Round in progress</p>
    <h1 id="title">Focus time</h1>
    <p class="left" id="left" role="timer" aria-live="off">--:--</p>
    <p class="left-label">left in this round</p>
    <p class="task" id="task" hidden>Working on <b id="taskName"></b></p>
    <p class="site"><span id="site">This site</span> is blocked until the round ends.</p>
  </section>
  <div class="acts">
    <button class="btn solid" id="back" type="button">Back to Pomodoro Ledger</button>
    <button class="link pass" id="pass" type="button">Open anyway for 5 minutes <small id="passLeft"></small></button>
    <p class="msg" id="msg" role="status"></p>
  </div>
</main>
<script type="module" src="blocked.js"></script>
</body>
</html>
